server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router client-side routing) — bilinmeyen bir yol (ör.
    # doğrudan /login'e gitme veya /organization/units'te sayfa
    # yenileme) diskte gerçek bir dosya olarak YOKTUR; nginx'in
    # varsayılan yapılandırması bu durumda 404 döner. index.html'e
    # düşerek React Router'ın kendi route'unu çözmesine izin verilir.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
