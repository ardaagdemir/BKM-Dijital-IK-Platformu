# US-09.3.1: core.notification.EmailNotificationService core modülünde yaşıyor ve
# core'a bağımlı OLAN HER modülün izole test bağlamına component-scan ile dahil
# oluyor — bu bean bir JavaMailSender bekliyor, Spring Boot'un mail auto-configuration'ı
# ise yalnızca spring.mail.host tanımlıysa bu bean'i oluşturuyor. Bu ayar yalnızca
# bean'in var olmasını sağlamak için (test gerçek bir SMTP sunucusuna bağlanmaya
# çalışmaz) — leave/src/test/resources/application.yml'deki (US-04.3.1) AYNI ayar.
spring:
  mail:
    host: localhost
    port: 1025

app:
  mail:
    from-address: noreply@dijitalik.local

  security:
    # US-09.9.1: core.security.EncryptedStringConverter core modülünde yaşıyor ve
    # AYNI cascade nedeniyle (bkz. app.mail.from-address yorumu) bu modülün izole
    # test bağlamına da dahil oluyor — @Value("${app.security.encryption-key}")
    # olmadan bean oluşturulamaz. Gerçek bir anahtar DEĞİL, yalnızca test amaçlı.
    encryption-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=

  clamav:
    # US-09.7.2: platform.file.ClamAvVirusScanService de bu context'e dahil
    # (AYNI cascade, bkz. app.mail.from-address yorumu) — yalnızca bean'in
    # KURULABİLMESİ için (gerçek çağrılar platform.PlatformTestApplication'daki
    # @Primary stub tarafından karşılanıyor, buraya hiç ulaşmaz).
    host: localhost
    port: 3310
