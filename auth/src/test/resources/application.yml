# US-08D.1.4: spring-boot-starter-mail'in JavaMailSender bean'ini yalnızca
# spring.mail.host tanımlıysa otomatik oluşturması nedeniyle test classpath'inde
# de bir değer gerekiyor — leave/src/test/resources/application.yml'deki
# (US-04.3.1) AYNI ayar, testler gerçek bir SMTP sunucusuna bağlanmaya
# çalışmaz (StepUpNotificationService bağlantı hatalarını yutar/loglar).
spring:
  mail:
    host: localhost
    port: 1025

app:
  mail:
    from-address: noreply@dijitalik.local

  security:
    # US-09.9.1: core.security.EncryptedStringConverter core modülünde yaşıyor ve
    # AYNI cascade nedeniyle (bkz. app.mail.from-address yorumu) bu modülün izole
    # test bağlamına da dahil oluyor — @Value("${app.security.encryption-key}")
    # olmadan bean oluşturulamaz. Gerçek bir anahtar DEĞİL, yalnızca test amaçlı.
    encryption-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
