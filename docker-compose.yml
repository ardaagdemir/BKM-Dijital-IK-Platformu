services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dijitalik
      POSTGRES_USER: dijitalik
      POSTGRES_PASSWORD: dijitalik
    ports:
      # Host tarafında 5433 kullanılıyor; bu makinede 5432'yi zaten kullanan yerel bir
      # PostgreSQL kurulumu olabilir. Servisler arası iletişim (backend -> postgres)
      # Docker'ın iç ağı üzerinden, konteyner içindeki standart 5432 portuyla yapılır;
      # bu satır yalnızca host makineden (ör. psql ile) dışarıdan erişim içindir.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dijitalik"]
      interval: 5s
      timeout: 5s
      retries: 10

  # US-09.10.2: Zamanlanmış veritabanı yedeği — ücretsiz/açık kaynak, self-hosted,
  # bu iş için özel yapılmış bir imaj (sıfırdan script yazmak yerine). Varsayılan
  # olarak her gün 02:00'de (SCHEDULE) plain SQL dump alır, yerel bir Docker
  # volume'a (postgres_backups, "postgres" servisininkinden AYRI) yazar; retention
  # BACKUP_KEEP_* ile yönetilir. Bulut depolama/ücretli bir servis YOK. Manuel bir
  # yedek/geri yükleme için (ör. canlı doğrulama): `docker exec <konteyner>
  # /backup.sh` / `/restore.sh <dosya>` — imajın kendi sağladığı script'ler.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: dijitalik
      POSTGRES_USER: dijitalik
      POSTGRES_PASSWORD: dijitalik
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # US-04.3.1: Yerel geliştirme/test için SMTP yakalayıcı (gerçek e-posta göndermez,
  # web arayüzü + REST API üzerinden gelen postaları gösterir). Üretimde MAIL_HOST/
  # MAIL_PORT/MAIL_FROM_ADDRESS ortam değişkenleri gerçek bir SMTP sağlayıcısına
  # işaret edecek şekilde ayarlanır; bu servis yalnızca bu compose dosyasında var.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # US-09.7.2: Yüklenen dosyaların (politika dokümanı, aday CV'si, masraf belgesi)
  # gerçek zamanlı virüs taraması — self-hosted, ücretsiz/açık kaynak. İlk
  # başlangıçta virüs imza veritabanını indirdiğinden (freshclam) birkaç dakika
  # sürebilir; bu nedenle backend yalnızca servisin BAŞLAMASINI bekliyor
  # (mailpit'teki AYNI `service_started` deseni), sağlıklı olmasını DEĞİL —
  # tarama isteği ClamAV tam hazır olmadan gelirse bağlantı hatası olarak
  # (500) yüzeye çıkar, kalıcı bir sorun değildir.
  clamav:
    image: clamav/clamav:stable
    # Resmi imaj yalnızca amd64 için yayınlanıyor (arm64/Apple Silicon YOK) —
    # Docker Desktop'ın Rosetta/QEMU emülasyonuyla çalıştırılıyor. Daha az
    # bakımlı bir topluluk imajı yerine RESMİ imajın emülasyonla
    # çalıştırılması tercih edildi.
    platform: linux/amd64
    ports:
      - "3310:3310"

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dijitalik
      DB_USER: dijitalik
      DB_PASSWORD: dijitalik
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      clamav:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  postgres_backups:
